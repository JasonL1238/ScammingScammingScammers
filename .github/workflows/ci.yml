# The push gate for the whole repository: every push runs the checks of the
# local pre-commit verification loop (docs/execution-log.md) plus the install
# shapes only CI exercises, and every run is allowed to complete — no
# concurrency cancellation, so every commit carries its own completed verdict
# and seeded red-proof runs on throwaway branches are never cancelled into
# evidence-free "cancelled" conclusions. A red run on main halts all other
# work until it is fixed.
#
# The `tests` matrix is the full python x install-shape square: the realtime
# stack that mirrors the development venv, and the light install that the
# safety-critical layer promises to pass with no heavy media deps — each on
# both the oldest supported interpreter (pyproject: >=3.11) and the one
# development runs on.

name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (py${{ matrix.python }} ${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        extras: ["dev", "dev,media"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest

  textloop:
    name: textloop --all-scripts --dry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Base deps only: the dry release gate must not need the dev or media
      # extras, so a broken import in the light install shape fails here.
      - run: python -m pip install -e .
      - run: python -m ssscammers.simscammer.textloop --all-scripts --dry

  migrations:
    name: migration runner (postgres, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ssscammers
          POSTGRES_PASSWORD: ssscammers
          POSTGRES_DB: ssscammers
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ssscammers"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIGRATIONS_TEST_DATABASE_URL: postgresql://ssscammers:ssscammers@localhost:5432/ssscammers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,db]"
      # The grep guards make a vacuous pass impossible: an env-var rename on
      # either side (here or in the test module) or a lost asyncpg install
      # would otherwise skip every test and leave this job green while
      # verifying nothing.
      - name: run the migration suite (skips are failures here)
        run: |
          set -o pipefail
          python -m pytest -m migrations 2>&1 | tee pytest-migrations.txt
          grep -qE "[1-9][0-9]* passed" pytest-migrations.txt
          ! grep -qE "[1-9][0-9]* skipped" pytest-migrations.txt

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
