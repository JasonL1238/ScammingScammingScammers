[project]
name = "ssscammers"
version = "0.1.0"
description = "Inbound-only AI scam-baiter phone agent: answers scam calls in persona and wastes scammers' time."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "twilio>=9.3",
    "anthropic>=0.116",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The realtime media stack. Kept separate so the safety/unit test suite
# (fiction pack, output filter, enums, FSM) runs with no heavy deps.
# `websocket` carries the FastAPI transport and `soundfile` the ambient mixer — both
# are used by ssscammers/agent/media.py and neither ships with the base package.
# Pinned to 1.x: the 0.0.x line puts these modules at different import paths
# (`pipecat.transports.network.fastapi_websocket`), so an older resolve fails at import
# rather than at runtime.
media = [
    "pipecat-ai[deepgram,cartesia,elevenlabs,silero,websocket,soundfile]>=1.7",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ssscammers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The import mode is pinned to the one the suite is proven under (prepend is
# pytest's current default) so an upstream default change cannot alter
# collection semantics silently. The pin is a declaration, not a mechanism:
# `from helpers import ...` resolves in every mode via the sys.path insert in
# tests/conftest.py.
addopts = "--import-mode=prepend"
filterwarnings = ["error::DeprecationWarning:ssscammers.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
