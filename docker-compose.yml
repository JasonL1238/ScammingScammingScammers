# One VM, one stack. At the volume this system sees — a handful of calls a day at
# the very most — splitting these across hosts would add failure modes without
# adding capacity.
#
# Only two things are meant to be reachable from the public internet: the Twilio
# webhooks and the media-stream WebSocket. The dashboard (planned; its directory is
# not in the repo yet) will hold recordings of real people and is bound to the
# tailnet instead.

# One definition of the in-network DSN: migrate, agent, and (when its phase
# lands) enrichment must agree on it, or the migrate gate stops guaranteeing the
# agent never serves against an unmigrated database.
x-container-database-url: &container_database_url
  postgresql://ssscammers:${POSTGRES_PASSWORD:-ssscammers}@postgres:5432/ssscammers

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ssscammers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssscammers}
      POSTGRES_DB: ssscammers
    volumes:
      # Schema lives in db/migrations, applied by the migrate one-shot below —
      # tracked, checksummed, and safe on fresh and existing volumes alike.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssscammers"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: applies pending migrations (python -m ssscammers.db), then exits.
  # The agent is gated on its success, so the stack never serves against a
  # database the runner has not brought up to date.
  migrate:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    command: ["python", "-m", "ssscammers.db"]
    # No env_file: the runner consumes exactly one variable, and a one-shot
    # that never needed the provider keys should never hold them
    # (docs/secrets.md rule 3).
    environment:
      DATABASE_URL: *container_database_url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    # Long-lived WebSockets carrying realtime audio. A stalled event loop is
    # audible, so this process does no blocking work and no heavy lifting.
    # One worker, always: the concurrency cap and the live-call registry are in
    # process memory, so a second worker would answer calls the first cannot see.
    command: ["python", "-m", "ssscammers.agent", "--port", "8080"]
    env_file:
      - path: .env
        required: false
    environment:
      # Container truth lives next to the topology: `environment` beats
      # `env_file`, so the shared .env stays host-oriented (localhost) for
      # local tooling while containers reach postgres by service name.
      DATABASE_URL: *container_database_url
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Loopback only. Caddy terminates TLS and is the sole public entrypoint; binding
    # 0.0.0.0 here would expose the media socket's path token in cleartext and publish
    # /healthz to anyone, while the planned dashboard next door is carefully bound to
    # loopback.
    ports:
      - "127.0.0.1:8080:8080"
    # The daily minute/spend/repeat-caller counters (see ssscammers/agent/daily_ledger.py).
    # A named volume, not the container filesystem: `restart: unless-stopped` survives a
    # crash, but `up -d --build` recreates this container, and the counters living in its
    # writable layer would reset on every deploy. That is the thing the ledger exists to
    # survive — a limit cleared by the routine operation is not a limit.
    volumes:
      - agentstate:/var/lib/ssscammers
    # Deploys drop every call in flight — Twilio's <Connect><Stream> does not
    # reconnect. Drain rather than kill, and avoid deploying while a call is up.
    stop_grace_period: 120s
    restart: unless-stopped

  # Profile-gated until its phase builds the package: the slot is declared, the
  # module does not exist yet, and a default `up --build` must not try it.
  enrichment:
    profiles: ["enrichment"]
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    command: ["python", "-m", "ssscammers.enrichment.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *container_database_url
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Profile-gated until its phase builds the directory (see the header note).
  # Deliberately no env_file and no DSN here: the dashboard's phase gives it a
  # read-only Postgres role and the narrowest env it needs — it must never hold
  # the agent's provider keys, and wiring the read-write DSN now would preempt
  # that decision.
  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./dashboard
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to loopback on purpose. Reach it over Tailscale; do not publish it.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [agent]
    environment:
      # Must match the host in PUBLIC_BASE_URL — Twilio signs the public URL.
      # The localhost default boots a clean checkout on Caddy's internal CA.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
  agentstate:
