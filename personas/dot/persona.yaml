id: dot
display_name: Dot
description: >
  Fumble-prone and endlessly apologetic; always one digit away from success. The
  premium-voice persona — the texture of the sighs and coughs is what sells it, so
  she runs on the more expressive, slower engine where the latency is in character.

voice:
  # Was written for ElevenLabs' expressive Eleven v3 tier, whose slower synthesis read
  # as an anxious pensioner squinting at a card. Nothing selects ElevenLabs, so that
  # bundle could not be served at all; moved to Cartesia to make the character usable.
  # The performance now has to come from the pacing config and the playbooks instead.
  tts: cartesia
  # Cartesia "Edna - Graceful Veteran": matured female, gentle wisdom and poise. Picked
  # to sit clearly apart from Marjorie's warmer, chattier Marge.
  voice_id: 19e399df-5b30-4fba-9d1d-99434f993614
  model:
  # NOT APPLIED YET — see VoiceConfig.speed.
  speed: slow

sound_pack:
  fillers:
    - "sorry_sorry.wav"
    - "right_ive_got_it.wav"
    - "sigh_soft.wav"
    - "cough_small.wav"
  holds:
    - "handbag_rummage.wav"
    - "drawer_and_mutter.wav"
  ambient: "kitchen_clock_bed.wav"

pacing:
  reply_delay_ms_mean: 1400
  reply_delay_ms_stdev: 700
  hold_probability: 0.12
  hold_seconds_min: 15
  hold_seconds_max: 75
  # NOT APPLIED YET — barge-in is disabled; see Pacing.ignore_interruption_probability.
  ignore_interruption_probability: 0.1

tactics:
  fumble_data: 0.45
  read_back: 0.20
  repeat_request: 0.10
  hold_on: 0.10
  mishear: 0.05
  eager_nonconvergence: 0.05
  tangent: 0.05
